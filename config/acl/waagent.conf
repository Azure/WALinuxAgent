#
# Microsoft Azure Linux Agent Configuration (ACL)
#

Extensions.Enabled=y

# Auto-detect the provisioning agent (coreos-cloudinit or waagent).
Provisioning.Agent=auto
Provisioning.DeleteRootPassword=n
Provisioning.RegenerateSshHostKeyPair=n
Provisioning.SshHostKeyPairType=auto
Provisioning.MonitorHostName=y
Provisioning.DecodeCustomData=y
Provisioning.ExecuteCustomData=n
Provisioning.AllowResetSysUser=n

ResourceDisk.Format=y
ResourceDisk.Filesystem=ext4
ResourceDisk.MountPoint=/mnt/resource
ResourceDisk.EnableSwap=n
ResourceDisk.SwapSizeMB=0
ResourceDisk.MountOptions=None

LBProbeResponder=y

Logs.Verbose=n
# Logs.Console=y

# Enable OpenTelemetry tracing. Tracing requires Python 3.10 or newer.
OpenTelemetry.Enabled=y

# HostGAPlugin /traces request timeout in seconds
OpenTelemetry.ExportTimeoutSeconds=10

# Delay between export attempts in milliseconds
OpenTelemetry.ExportIntervalMilliseconds=5000

# Maximum number of spans buffered in memory
OpenTelemetry.MaxQueueSize=2048

# Maximum number of spans sent in a single export request
OpenTelemetry.MaxExportBatchSize=64

# Sampling ratio for traces created by the Agent, from 0.0 (none) to 1.0 (all).
# Upstream sampled and unsampled decisions are always preserved.
OpenTelemetry.RootSamplingRatio=1.0

OS.EnableFIPS=n
OS.SshDir=/etc/ssh
OS.RootDeviceScsiTimeout=300
OS.OpensslPath=None

#AutoUpdate.Enabled=n

# Add firewall rules to protect access to Azure host node services
OS.EnableFirewall=y
