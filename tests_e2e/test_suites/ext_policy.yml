#
# The test suite verifies that disallowed extensions are not processed, but the agent should still report status.
#
name: "ExtensionPolicy"
tests:
  - "ext_policy/ext_policy.py"
images:
  - "endorsed"
  - "cvm-endorsed"
skip_on_images:
  # The test depends on Microsoft.Azure.Monitor.AzureMonitorLinuxAgent, which does not support these distros since version 1.43
  - "centos_79"
  - "centos_82"
  # The test depends on Microsoft.Azure.Monitor.AzureMonitorLinuxAgent, which frequently fails on Debian 12/13 in China cloud with '2026/09/22 08:31:44 E: Unable to lock directory /var/lib/apt/lists/'
  - "AzureChinaCloud:debian_12"
  - "AzureChinaCloud:debian_13"
