#
# The test suite verifies that disallowed extensions are not processed, but the agent should still report status.
#
# TODO: This test suite takes 30+ minutes to run. This should be optimized to reduce impact to pipeline run times.
name: "ExtensionPolicy"
tests:
  - "ext_policy/ext_policy.py"
images:
  - "random(endorsed,10)" # TODO: Remove randomization and run on all endorsed images once the test suite is optimized to reduce runtime.
  - "cvm-endorsed"
owns_vm: true   # This test owns the VM because it is causing environment timeouts when shared with other tests. TODO: Remove this once the test suite is optimized to reduce runtime and can run on all endorsed images.
skip_on_images:
  - "debian_11" # TODO: AzureSecurityLinuxAgent-2.39.1433 extension is failing on Debian 11; skip this image until the issue in the extension is fixed
  - "AzureUSGovernment:suse_12" # TODO: Microsoft.Azure.Monitor.AzureMonitorLinuxAgent-1.44.0 extension does not support Suse 12; skip this image until v1.45.0 of the extension is deployed in Gov
  # The test depends on Microsoft.Azure.Monitor.AzureMonitorLinuxAgent, which does not support these distros since version 1.43
  - "centos_79"
  - "centos_82"
  # TODO: AzureMonitorLinuxAgent does not support Ubuntu 26.04 in the sovereign clouds. Remove these exclusions when the extension is updated.
  - "AzureChinaCloud:ubuntu_2604"
  - "AzureChinaCloud:ubuntu_2604_minimal"
  - "AzureUSGovernment:ubuntu_2604"
  - "AzureUSGovernment:ubuntu_2604_minimal"
