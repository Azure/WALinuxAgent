#
# The test suite verify the agent running in expected cgroups and also, checks agent tracking the cgroups for polling resource metrics,
# checks unexpected processes in the agent cgroups, and it verifies the agent cpu quota is set as expected.
#
name: "AgentCgroups"
tests:
  - "agent_cgroups/agent_cgroups.py"
  - "agent_cgroups/agent_cpu_quota.py"
  - "agent_cgroups/agent_memory_quota.py"
  - "agent_cgroups/agent_memory_self_monitor.py"
  - "agent_cgroups/agent_cgroups_process_check.py"
images:
  - "cgroups-endorsed"
  # TODO : Currently some extensions(AMA, VMAccess) do not support 25_10. Move this image to the "cgroups-endorsed" image set once those issues have been fixed.
  - "ubuntu_2510"
skip_on_images:
  # The cpu and memory controllers not populated within the test timeout window, so skip running test in those distros.
  - "AzureChinaCloud:suse_15"
  - "AzureUSGovernment:suse_15"
owns_vm: true