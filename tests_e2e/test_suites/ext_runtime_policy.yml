#
# The test suite verifies that the Agent passes runtime policy to policy-capable extensions.
#
name: "ExtensionRuntimePolicy"
tests:
  - "ext_runtime_policy/ext_runtime_policy.py"
images:
  - "random(endorsed,10)"
#  - "cvm-endorsed"        # TODO: CVM skus are limited capacity in canary. Run this test on CVMs once the test is moved to a non-canary region or capacity is increased.
locations: "AzureCloud:centraluseuap"   # Test CSE 2.9.0 is only available in canary regions  # TODO: Once the prod CSE supports runtime policy, we can remove the canary region restriction
skip_on_images:
  - "centos_79"           # TODO: Test CSE install fails due to golang issues on CentOS 7.9. Remove this once the issue is resolved.
  - "rhel_79"             # TODO: Test CSE install fails due to golang issues on RHEL 7.9. Remove this once the issue is resolved.
  - "ubuntu_1604"         # TODO: Test CSE cannot load libcrypto.so on Ubuntu 16.04. Remove this once the extension supports this image.
skip_on_clouds:
  - "AzureChinaCloud"     # TODO: Remove the skip once the extension is published to China cloud
  - "AzureUSGovernment"   # TODO: Remove the skip once the extension is published to Gov cloud
