#
# Adds extensions with multiple dependencies to VMSS using 'provisionAfterExtensions' property and validates they are
# enabled in order of dependencies.
#
name: "ExtSequencing"
tests:
  - "ext_sequencing/ext_sequencing.py"
images: "endorsed"
# This scenario is executed on instances of a scaleset created by the agent test suite.
executes_on_scale_set: true
skip_on_images:
  # TODO: Currently AlmaLinux is not available for scale sets; enable this image when it is available.
  - "alma_8"
  - "alma_9"
  - "alma_10"
  # TODO: The test depends on Microsoft.Azure.Monitor.AzureMonitorLinuxAgent, which currently does not support Azure Linux 4. Remove this exclusion when the issue is fixed.
  - "azure-linux_4"
  # The test depends on Microsoft.Azure.Monitor.AzureMonitorLinuxAgent, which does not support these distros since version 1.43
  - "centos_79"
  - "centos_82"
  - "suse_12"
  # TODO: AzureMonitorLinuxAgent does not support Ubuntu 26.04 in the sovereign clouds. Remove these exclusions when the extension is updated.
  - "AzureChinaCloud:ubuntu_2604"
  - "AzureChinaCloud:ubuntu_2604_minimal"
  - "AzureUSGovernment:ubuntu_2604"
  - "AzureUSGovernment:ubuntu_2604_minimal"
