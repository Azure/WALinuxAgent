#
# The test suite verifies that disallowed extensions and any extensions dependent on disallowed extensions are not processed,
# but the agent should still report status.
name: "ExtPolicyWithDependencies"
tests:
  - "ext_policy/ext_policy_with_dependencies.py"
images:
  - "endorsed"
  - "cvm-endorsed"
executes_on_scale_set: true
owns_vm: false

skip_on_images:
  # TODO: Currently AlmaLinux is not available for scale sets; enable this image when it is available.
  - "alma_8"
  - "alma_9"
  - "alma_10"
  # TODO: The test depends on Microsoft.Azure.Monitor.AzureMonitorLinuxAgent, which currently does not support Azure Linux 4. Remove this exclusion when the issue is fixed.
  - "azure-linux_4"
  # The test depends on Microsoft.Azure.Monitor.AzureMonitorLinuxAgent, which does not support these distros since version 1.43
  - "centos_79"
  - "centos_82"

# TODO: The current deployment of VmAccess 1.5.22 prevents the extension from uninstalling; enable this test when the issue is fixed
skip_on_clouds:
  - "AzureUSGovernment"
