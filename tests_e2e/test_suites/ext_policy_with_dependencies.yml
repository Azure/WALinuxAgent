#
# The test suite verifies that disallowed extensions and any extensions dependent on disallowed extensions are not processed,
# but the agent should still report status.
name: "ExtPolicyWithDependencies"
tests:
  - "ext_policy/ext_policy_with_dependencies.py"
images:
  - "endorsed"
  - "cvm-endorsed"
executes_on_scale_set: true
owns_vm: false
skip_on_images:
  # TODO: Currently AlmaLinux is not available for scale sets; enable this image when it is available.
  - "alma_8"
  - "alma_9"
  - "alma_10"
  # The test depends on Microsoft.Azure.Monitor.AzureMonitorLinuxAgent, which does not support these distros since version 1.43
  - "centos_79"
  - "centos_82"
  # TODO: The test depends on Microsoft.OSTCExtensions.VMAccessForLinux, which currently does not support SUSE 16. Remove this exclusion when the issue is fixed.
  - "suse_16"
  # TODO: VMAccess fails on Ubuntu 24. Remove this exclusion when the extension is updated.
  - "AzureChinaCloud:ubuntu_2604"
  - "AzureChinaCloud:ubuntu_2604_minimal"
  - "AzureChinaCloud:debian_12"             # AMA takes 10+ minutes to install on Debian 12, since it does an apt-get update. Skip on that image since extension takes too long to install
  - "AzureChinaCloud:debian_13"             # AMA takes 10+ minutes to install on Debian 13, since it does an apt-get update. Skip on that image since extension takes too long to install